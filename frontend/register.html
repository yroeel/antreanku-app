<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Pasien Baru - Antreanku</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-info">
            <span><i class="fa-solid fa-clinic-medical"></i> Puskesmas / Klinik Utama Antreanku</span>
            <span><i class="fa-solid fa-clock"></i> Jam Pelayanan: 08.00 - 14.00 WIB</span>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo-icon" style="margin: 0 auto 1.25rem auto;">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h2 style="color: var(--primary-dark); font-weight: 800; font-size: 1.4rem;">Daftar Akun Baru</h2>
            <p style="color: #64748b; font-size: 0.88rem; margin-bottom: 1.5rem;">Buat akun pasien untuk mendaftar antrean online</p>

            <form id="registerForm">
                <div class="form-group" style="text-align: left;">
                    <label for="regNama">Nama Lengkap</label>
                    <input type="text" id="regNama" class="form-control" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="nama@email.com" required>
                </div>

                <div class="form-group" style="text-align: left;">
                    <label for="regPassword">Kata Sandi</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
                    <i class="fa-solid fa-user-check"></i> Daftar Sekarang
                </button>
            </form>

            <p style="margin-top: 1.25rem; font-size: 0.85rem; color: #64748b;">
                Sudah punya akun? <a href="login.html" style="color: var(--primary-dark); font-weight: 700; text-decoration: none;">Masuk di sini</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('regNama').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama, email, password, role: 'patient' })
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    alert('Registrasi berhasil! Silakan login dengan email dan password Anda.');
                    window.location.href = 'login.html';
                } else {
                    alert(result.message || 'Gagal mendaftar akun.');
                }
            } catch (err) {
                alert('Gagal terhubung ke server backend.');
            }
        });
    </script>
</body>
</html>
