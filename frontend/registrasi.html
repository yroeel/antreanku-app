<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Akun - Antreanku</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<div class="top-bar"><div class="top-bar-info">
  <span><i class="fa-solid fa-clinic-medical"></i> Puskesmas / Klinik Utama Antreanku</span>
  <span><i class="fa-solid fa-clock"></i> Jam pelayanan 08.00 - 14.00 WIB</span>
</div></div>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-logo-icon"><i class="fa-solid fa-user-plus"></i></div>
    <h2>Daftar akun baru</h2>
    <p class="sub">Lengkapi data diri untuk mengambil antrean</p>
    <form id="registerForm">
      <div class="form-group"><label for="name">Nama lengkap</label>
        <input type="text" id="name" class="form-control" placeholder="Contoh: Ahmad Subagja" required></div>
      <div class="form-group"><label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required></div>
      <div class="form-group"><label for="phone">Nomor telepon / WhatsApp</label>
        <input type="tel" id="phone" class="form-control" placeholder="08123456789" required></div>
      <div class="form-group"><label for="password">Kata sandi</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary btn-block">Daftar akun</button>
    </form>
    <p class="auth-foot">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</main>
<script src="js/config.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const payload = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value
  };
  try {
    const response = await fetch(`${API_BASE_URL}/auth/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (result.success) { alert('Registrasi berhasil! Silakan login.'); window.location.href = 'login.html'; }
    else { alert(result.message || 'Gagal mendaftar.'); }
  } catch (error) { console.error('Error register:', error); alert('Gagal terhubung ke server.'); }
});
</script>
</body>
</html>
